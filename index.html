<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIE Pseudocode Setup Generator</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #10b981;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            border: 1px solid var(--border);
        }
        h2 { margin-top: 0; color: #fff; }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        label { margin-bottom: 0.5rem; font-weight: 500; }
        input[type="file"] {
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--background);
            color: var(--text);
        }
        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        button, .btn-secondary {
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            font-size: 1rem;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-primary:disabled { background-color: var(--text-muted); cursor: not-allowed; }
        .btn-secondary {
            background-color: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-secondary:hover { background-color: var(--border); }
        .output-area { margin-top: 2rem; display: none; }
        pre {
            background-color: #000;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid var(--border);
            color: var(--accent);
            white-space: pre-wrap;
            font-family: monospace;
        }
        .copy-btn {
            background-color: #059669;
            margin-top: 0.5rem;
        }
        .copy-btn:hover { background-color: #047857; }
    </style>
</head>
<body>

<div class="container">
    <h2>CIE Setup Generator</h2>
    <p>Upload an exam question to automatically generate strictly formatted test data for the PapersDock compiler.</p>

    <div class="form-group">
        <label for="imageUpload">Upload Exam Question (Image)</label>
        <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/jpg">
    </div>

    <div class="button-group">
        <button id="generateBtn" class="btn-primary" onclick="generateCode()">Generate Test Data</button>
        <a href="https://www.papersdock.com/pseudocode" target="_blank" class="btn-secondary">Open Compiler</a>
    </div>

    <div class="output-area" id="outputArea">
        <label>Generated CIE Pseudocode:</label>
        <pre><code id="codeOutput"></code></pre>
        <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">Copy Clean Code</button>
    </div>
</div>

<script>
    async function generateCode() {
        const fileInput = document.getElementById('imageUpload');
        const btn = document.getElementById('generateBtn');
        const outputArea = document.getElementById('outputArea');
        const codeOutput = document.getElementById('codeOutput');

        if (!fileInput.files[0]) {
            alert("Please select an image first.");
            return;
        }

        btn.disabled = true;
        btn.textContent = "Analyzing Question...";
        outputArea.style.display = "none";

        try {
            const file = fileInput.files[0];
            const base64Data = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });

            const response = await fetch('/api/generate', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    image: base64Data,
                    mimeType: file.type
                })
            });

            // Prevent crashing if Vercel returns an HTML error page (e.g., payload too large)
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const textError = await response.text();
                console.error("Server HTML Error:", textError);
                throw new Error("The server crashed. The image might be too large (over 4.5MB) or the API timed out.");
            }

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Failed to generate code.");
            }

            codeOutput.textContent = data.code;
            outputArea.style.display = "block";

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = "Generate Test Data";
        }
    }

    function copyToClipboard() {
        const code = document.getElementById('codeOutput').textContent;
        const copyBtn = document.getElementById('copyBtn');
        
        navigator.clipboard.writeText(code).then(() => {
            copyBtn.textContent = "Copied to Clipboard!";
            copyBtn.style.backgroundColor = "#047857";
            setTimeout(() => {
                copyBtn.textContent = "Copy Clean Code";
                copyBtn.style.backgroundColor = "#059669";
            }, 2000);
        });
    }
</script>

</body>
</html>
