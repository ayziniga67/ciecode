<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIE Pseudocode Setup Generator</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            border: 1px solid var(--border);
        }
        h2 {
            margin-top: 0;
            color: #fff;
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        input[type="password"], input[type="file"] {
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--background);
            color: var(--text);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            font-size: 1rem;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }
        .output-area {
            margin-top: 2rem;
            display: none;
        }
        pre {
            background-color: #000;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid var(--border);
            color: #10b981; /* Green text to look like a terminal */
        }
        .copy-btn {
            background-color: #059669;
            margin-top: 0.5rem;
        }
        .copy-btn:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CIE Setup Generator</h2>
    <p>Upload your exam question. The AI will generate pre-populated test arrays and variables for the <a href="https://www.papersdock.com/pseudocode" target="_blank" style="color: #60a5fa;">Papersdock Compiler</a>.</p>

    <div class="form-group">
        <label for="apiKey">OpenAI API Key (requires GPT-4o access)</label>
        <input type="password" id="apiKey" placeholder="sk-proj-..." autocomplete="off">
    </div>

    <div class="form-group">
        <label for="imageUpload">Upload Exam Question (Image)</label>
        <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/jpg">
    </div>

    <button id="generateBtn" onclick="generateCode()">Generate Test Data</button>

    <div class="output-area" id="outputArea">
        <label>Generated Pseudocode:</label>
        <pre><code id="codeOutput"></code></pre>
        <button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
    </div>
</div>

<script>
    const SYSTEM_PROMPT = `
You are an expert Cambridge Assessment International Education (CIE) Computer Science pseudocode translator. Your task is to analyze an exam question image and generate complete, syntactically valid CIE setup code to initialize pre-declared variables and arrays.

CRITICAL RULES:
1. Strict CIE Syntax: Use 1-based indexing (e.g., ARRAY[1:N] OF INTEGER), correct data types, and standard assignment (<-).
2. Intent & Target Value Detection (TEST CASES):
   - Identify the task (Search, Sort, Max/Min, Count).
   - IF SEARCHING: Ensure the target item appears AT LEAST ONCE in the generated array data so the student's code can successfully find a match. Include the target variable.
   - IF MAX/MIN: Include clear extreme numbers (highest/lowest) and negative numbers if applicable.
   - IF SORTING: Provide unordered data that clearly needs sorting.
3. Structure:
   - Header comment stating the detected intent and test cases.
   - Variable and Array declarations.
   - Sequential population of data.
   - End with: "// --- WRITE YOUR SOLUTION BELOW ---"
4. Output: Return ONLY the exact pseudocode. No markdown formatting ticks like \`\`\` or conversational text. Just the raw code.
`;

    async function generateCode() {
        const apiKey = document.getElementById('apiKey').value;
        const fileInput = document.getElementById('imageUpload');
        const btn = document.getElementById('generateBtn');
        const outputArea = document.getElementById('outputArea');
        const codeOutput = document.getElementById('codeOutput');

        if (!apiKey || !fileInput.files[0]) {
            alert("Please enter your API Key and upload an image.");
            return;
        }

        btn.disabled = true;
        btn.textContent = "Analyzing Exam Question...";

        try {
            // Convert image to Base64
            const file = fileInput.files[0];
            const base64Image = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });

            // Call OpenAI Vision API
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [
                        { role: "system", content: SYSTEM_PROMPT },
                        {
                            role: "user",
                            content: [
                                { type: "text", text: "Parse this exam question and generate the CIE setup pseudocode. Make sure to embed specific test cases based on what the algorithm is trying to find/do." },
                                { type: "image_url", image_url: { url: base64Image } }
                            ]
                        }
                    ],
                    max_tokens: 800,
                    temperature: 0.2
                })
            });

            const data = await response.json();

            if (data.error) {
                throw new Error(data.error.message);
            }

            let generatedCode = data.choices[0].message.content;
            
            // Clean up any stray markdown ticks just in case the LLM disobeys the prompt
            generatedCode = generatedCode.replace(/```(pseudocode|text|pascal)?\n/ig, '').replace(/```/ig, '').trim();

            codeOutput.textContent = generatedCode;
            outputArea.style.display = "block";

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = "Generate Test Data";
        }
    }

    function copyToClipboard() {
        const code = document.getElementById('codeOutput').textContent;
        navigator.clipboard.writeText(code).then(() => {
            alert("Copied! Paste this into line 1 of the Papersdock Compiler.");
        });
    }
</script>

</body>
</html>
